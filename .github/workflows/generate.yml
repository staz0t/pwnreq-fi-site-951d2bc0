name: Generate controlled frontend site
on:
  repository_dispatch:
    types: [on-registry-trigger]
permissions:
  contents: write
jobs:
  generate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind dispatched registry commit
        env:
          REGISTRY_REPO: ${{ github.event.client_payload.registryRepo }}
          REGISTRY_COMMIT: ${{ github.event.client_payload.registryCommit }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_REPO"
          test "${#REGISTRY_COMMIT}" -eq 40
          git clone --filter=blob:none "https://github.com/$REGISTRY_REPO.git" registry
          git -C registry checkout --detach "$REGISTRY_COMMIT"
          test "$(git -C registry rev-parse HEAD)" = "$REGISTRY_COMMIT"
      - name: Bind vulnerable frontend generator
        env:
          FRONTEND_SHA: c7a1a2ca5c6eadb06120d8b4019def8e594e3732
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/bazel-contrib/bcr-frontend.git frontend
          git -C frontend checkout --detach "$FRONTEND_SHA"
          test "$(git -C frontend rev-parse HEAD)" = "$FRONTEND_SHA"
          cp tools/frontend_https_integrity_test.go frontend/language/bcr/source_integrity_live_test.go
          SOURCE_URL="$(jq -r .url registry/modules/proof/1.0.0/source.json)"
          SOURCE_INTEGRITY="$(jq -r .integrity registry/modules/proof/1.0.0/source.json)"
          (cd frontend && SOURCE_URL="$SOURCE_URL" SOURCE_INTEGRITY="$SOURCE_INTEGRITY" go test ./language/bcr -run '^TestControlledHttpsSourceDropsReviewedIntegrity$' -count=1)
          mkdir -p evidence
          echo PRODUCTION_MAKE_BZL_REPOSITORY_HTTP_FORWARDS_HTTPS_OMITS > evidence/frontend-generator-test.txt
      - name: Run identical-byte control and attack
        env:
          REGISTRY_COMMIT: ${{ github.event.client_payload.registryCommit }}
          FRONTEND_SHA: c7a1a2ca5c6eadb06120d8b4019def8e594e3732
        run: python3 tools/generate_site.py --registry registry --registry-commit "$REGISTRY_COMMIT" --frontend-sha "$FRONTEND_SHA" --output stage
      - name: Compile and release current-schema documentation protobuf
        run: |
          set -euo pipefail
          mkdir -p frontend/controlled-source modules/proof/1.0.0 evidence
          cp stage/extracted/proof-1.0.0/proof.bzl frontend/controlled-source/proof.bzl
          curl --fail-with-body --location --silent --show-error \
            https://github.com/pcj/bazel/releases/download/constellate-v0.5.0/constellate-server.jar \
            --output constellate-server.jar
          echo 'fd0356772c61dcb3fb167ed020c417af4cbb5ba23247bdcb0dfa36838b77528d  constellate-server.jar' | sha256sum --check
          OUTPUT_PATH="$GITHUB_WORKSPACE/modules/proof/1.0.0/documentationinfo.pb.gz"
          (cd frontend && go run ./cmd/bzlcompiler \
            --java_interpreter_file="$(command -v java)" \
            --server_jar_file="$GITHUB_WORKSPACE/constellate-server.jar" \
            --log_file="$GITHUB_WORKSPACE/evidence/bzlcompiler.log" \
            --output_file="$OUTPUT_PATH" \
            '--bzl_file=proof|@proof//:proof.bzl|controlled-source/proof.bzl' \
            --module_dep=proof:NONE \
            controlled-source/proof.bzl)
          MARKER="$(cat stage/marker.txt)"
          (cd frontend && EXPECTED_MARKER="$MARKER" go run "$GITHUB_WORKSPACE/tools/readback.go" "$OUTPUT_PATH") | tee modules/proof/1.0.0/semantic-readback.txt
          : > stage/registry.pb
          : > stage/symbols.pb
          printf '%s\n' '<html><body>controlled release</body></html>' > stage/index.html
          (cd frontend && go run ./cmd/releasecompiler \
            --output_file="$GITHUB_WORKSPACE/evidence/site.tar" \
            --index_html_file="$GITHUB_WORKSPACE/stage/index.html" \
            --registry_file="$GITHUB_WORKSPACE/stage/registry.pb" \
            --module_registry_symbols_file="$GITHUB_WORKSPACE/stage/symbols.pb" \
            --modules_src="$OUTPUT_PATH")
          cp registry/modules/proof/1.0.0/source.json modules/proof/1.0.0/source.json
          cp stage/receipt.json evidence/receipt.json
          python3 tools/finalize_receipt.py evidence/receipt.json modules/proof/1.0.0/documentationinfo.pb.gz modules/proof/1.0.0/semantic-readback.txt evidence/site.tar
      - name: Force-push generated bytes to default branch
        env:
          REGISTRY_COMMIT: ${{ github.event.client_payload.registryCommit }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github tools modules evidence README.md
          git commit --allow-empty -m "Deploy registry $REGISTRY_COMMIT"
          git push --force origin HEAD:main
